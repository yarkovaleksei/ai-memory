# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "ai-memory"
arch: ${GOARCH}
platform: "linux"
version: "${VERSION}"
section: "default"
priority: "extra"
maintainer: "yarkovaleksei <yarkovaleksei@users.noreply.github.com>"
description: "Просмотр и правка памяти Claude Code и Codex"
vendor: "yarkovaleksei"
homepage: "https://github.com/yarkovaleksei/ai-memory"
license: "MIT"
release: "1"

# Окно и MCP-мост — в /usr/bin: мост ищется по этому пути при подключении к
# агентам (ADR-027). Каталог данных пользователя пакет не трогает.
contents:
  - src: "./bin/ai-memory"
    dst: "/usr/bin/ai-memory"
  - src: "./bin/ai-memory-mcp"
    dst: "/usr/bin/ai-memory-mcp"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/ai-memory.png"
  - src: "./build/linux/ai-memory.desktop"
    dst: "/usr/share/applications/ai-memory.desktop"
  # Профиль AppArmor с правилом userns для песочницы WebKitGTK (ADR-028).
  # Только в deb: Fedora живёт на SELinux, в Arch AppArmor не по умолчанию.
  - src: "./build/linux/apparmor/ai-memory"
    dst: "/etc/apparmor.d/ai-memory"
    packager: deb
    file_info:
      mode: 0644

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1

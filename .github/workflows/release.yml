# Релиз по тегу vX.Y.Z (ADR-027, ADR-029): пакеты macOS и Windows собираются
# каждый на своей системе и прикладываются к релизу GitHub вместе с
# SHA256SUMS-<система>.txt. Пакеты Linux владелец собирает и прикладывает
# локально: wails3 task release, wails3 task release:publish. Пакеты не
# подписаны — как их открыть, написано в README, раздел «Установка».
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # macOS собирает универсальный .app (arm64 + amd64) в .dmg с подписью
        # ad-hoc, Windows — установщик NSIS. Linux здесь нет: см. выше.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Версия — из тега без «v». Явно, а не из git describe: после yarn
      # install и генерации привязок дерево может стать «грязным».
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Версия из тега
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: yarn через corepack
        run: corepack enable

      - name: NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null; then choco install nsis -y; fi
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Зависимости фронтенда
        run: wails3 task deps

      - name: Тесты
        run: wails3 task test

      - name: Пакеты
        run: wails3 task package APP_VERSION="$VERSION"

      - name: Имена с версией и системой
        run: |
          mkdir dist
          case "$RUNNER_OS" in
            macOS)
              mv bin/*.dmg "dist/ai-memory-${VERSION}-macos-universal.dmg"
              (cd dist && shasum -a 256 ai-memory* > SHA256SUMS-macos.txt)
              ;;
            Windows)
              mv bin/*-installer.exe "dist/ai-memory-${VERSION}-windows-amd64-setup.exe"
              (cd dist && sha256sum ai-memory* > SHA256SUMS-windows.txt)
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      # Релиз создаёт тот, кто первый: этот job или локальная задача
      # release:publish с пакетами Linux. Второй только докладывает свои файлы.
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "ai-memory ${GITHUB_REF_NAME#v}" \
              --notes "Пакеты не подписаны. Установка и подключение MCP-моста — README, раздел «Установка»." \
              --generate-notes ||
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

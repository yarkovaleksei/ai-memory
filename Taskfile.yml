version: '3'

# Задачи ai-memory. Запуск: `wails3 task <имя>` (или `task <имя>`, если Task установлен отдельно).
# Платформенные задачи сборки и упаковки сгенерированы Wails и лежат в build/.

vars:
  APP_NAME: "ai-memory"
  BIN_DIR: "bin"
  # Фронтенд ставится и собирается только через yarn 4 (ADR-006).
  PACKAGE_MANAGER: "yarn"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Целевая ОС для build/package/run. По умолчанию — текущая, переопределяется GOOS.
  GOOS: '{{.GOOS | default OS}}'
  # Версия — из последнего тега vX.Y.Z (ADR-027): у релиза это сам тег, между
  # тегами — «1.2.0-3-gabc123», без тегов — 0.0.1-dev. Переопределяется
  # переменной окружения VERSION или `wails3 task … APP_VERSION=1.2.0`.
  # Вшивается в окно и в ai-memory-mcp через -X main.version.
  GIT_DESCRIBE:
    sh: git describe --tags --match "v[0-9]*" --dirty 2>/dev/null || echo v0.0.1-dev
  APP_VERSION: '{{.VERSION | default (trimPrefix "v" .GIT_DESCRIBE)}}'
  # Числовая часть X.Y.Z: установщик Windows и Info.plist другой не принимают.
  APP_VERSION_NUM: '{{regexFind "^[0-9]+[.][0-9]+[.][0-9]+" .APP_VERSION | default "0.0.1"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Собрать приложение для текущей ОС
    cmds:
      - task: "{{.GOOS}}:build"

  build:mcp:
    summary: Собрать MCP-мост bin/ai-memory-mcp — без Wails, GTK и фронтенда
    # Мост — обычное консольное приложение на чистом Go: CGO не нужен, поэтому
    # собирается под любую ОС и архитектуру с любой машины. Пакеты кладут его
    # рядом с окном (ADR-027).
    vars:
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
      OUTPUT: '{{.OUTPUT | default (print .BIN_DIR "/ai-memory-mcp" .EXT)}}'
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.ARCH | default ARCH}}"
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version={{.APP_VERSION}}" -o "{{.OUTPUT}}" ./cmd/ai-memory-mcp

  version:
    summary: Напечатать версию, которая попадёт в сборку
    silent: true
    cmds:
      - echo "{{.APP_VERSION}}"

  mcp:dev:
    summary: Собрать MCP-мост и напечатать команды, которые подключают его к Claude Code и Codex на копии фикстур
    vars:
      FX: "{{.ROOT_DIR}}/.task/dev-home"
      BIN: "{{.ROOT_DIR}}/{{.BIN_DIR}}/ai-memory-mcp"
      CFG: "{{.ROOT_DIR}}/.task/mcp-claude.json"
    # Мост подключается только на время запуска агента: флагом --mcp-config у
    # Claude Code и -c у Codex. В ~/.claude* и ~/.codex ничего не пишется.
    # Окружение направляет мост на копию фикстур, как у `dev`.
    cmds:
      - task: build:mcp
      - go run ./cmd/devhome fixtures/home .task/dev-home
      - silent: true
        cmd: |
          cat > "{{.CFG}}" <<EOF
          {"mcpServers": {"ai-memory": {"command": "{{.BIN}}", "args": ["-agent", "claude"], "env": {
            "AI_MEMORY_CLAUDE_DIRS": "{{.FX}}/.claude:{{.FX}}/.claude-work",
            "AI_MEMORY_CODEX_HOME": "{{.FX}}/.codex",
            "AI_MEMORY_AGENTS_DIR": "{{.FX}}/.agents",
            "AI_MEMORY_DATA_DIR": "{{.ROOT_DIR}}/.task/ai-memory-data",
            "AI_MEMORY_CONFIG_DIR": "{{.ROOT_DIR}}/.task/ai-memory-config"}}}}
          EOF
      - silent: true
        cmd: |
          echo
          echo "Claude Code:"
          echo "  cd {{.FX}}/projects/demo && claude --strict-mcp-config --mcp-config {{.CFG}}"
          echo
          echo "Codex:"
          echo "  cd {{.FX}}/projects/demo && codex \\"
          echo "    -c 'mcp_servers.ai-memory.command=\"{{.BIN}}\"' -c 'mcp_servers.ai-memory.args=[\"-agent\",\"codex\"]' \\"
          echo "    -c 'mcp_servers.ai-memory.env={AI_MEMORY_CLAUDE_DIRS=\"{{.FX}}/.claude:{{.FX}}/.claude-work\",AI_MEMORY_CODEX_HOME=\"{{.FX}}/.codex\",AI_MEMORY_AGENTS_DIR=\"{{.FX}}/.agents\",AI_MEMORY_DATA_DIR=\"{{.ROOT_DIR}}/.task/ai-memory-data\",AI_MEMORY_CONFIG_DIR=\"{{.ROOT_DIR}}/.task/ai-memory-config\"}'"

  package:
    summary: Собрать установочные пакеты для текущей ОС вместе с MCP-мостом (ADR-027)
    # Linux — deb, rpm и пакет Arch; macOS — универсальный .app в .dmg;
    # Windows — установщик NSIS для текущего пользователя. Всё — в bin/.
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Запустить собранное приложение
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Окно в режиме разработки на фикстурах; REAL=true — на настоящей памяти
    vars:
      FX: "{{.ROOT_DIR}}/.task/dev-home"
      LIST_SEP: '{{if eq OS "windows"}};{{else}}:{{end}}'
    # AGENTS.md: разработка по умолчанию идёт на фикстурах. Окно пишет в память
    # (правки, «Исправить индекс», объединение), поэтому работает на свежей копии
    # fixtures/home в .task/dev-home, а не на самих фикстурах: иначе правки из окна
    # ломают тесты. Бэкапы и индекс тоже начинаются заново — пути в них от копии.
    # cmd/devhome заменяет в копии выдуманный /home/me её путём: проекты из памяти
    # указывают на каталоги копии, и видны их инструкции и навыки.
    # Пустые значения при REAL=true означают «переменная не задана», и приложение
    # ищет память по обычным путям.
    env:
      AI_MEMORY_CLAUDE_DIRS: '{{if ne .REAL "true"}}{{.FX}}/.claude{{.LIST_SEP}}{{.FX}}/.claude-work{{end}}'
      AI_MEMORY_CODEX_HOME: '{{if ne .REAL "true"}}{{.FX}}/.codex{{end}}'
      AI_MEMORY_AGENTS_DIR: '{{if ne .REAL "true"}}{{.FX}}/.agents{{end}}'
      AI_MEMORY_DATA_DIR: '{{if ne .REAL "true"}}{{.ROOT_DIR}}/.task/ai-memory-data{{end}}'
      AI_MEMORY_CONFIG_DIR: '{{if ne .REAL "true"}}{{.ROOT_DIR}}/.task/ai-memory-config{{end}}'
    cmds:
      - '{{if ne .REAL "true"}}rm -rf .task/ai-memory-data && go run ./cmd/devhome fixtures/home .task/dev-home{{else}}true{{end}}'
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  bindings:
    summary: Перегенерировать TypeScript-привязки к Go-сервисам в frontend/bindings
    cmds:
      - task: common:generate:bindings

  deps:
    summary: Установить зависимости фронтенда по yarn.lock без изменений
    dir: frontend
    cmds:
      - yarn install --immutable

  # Встраиваемая сборка фронтенда нужна go vet и go test для пакета main (//go:embed frontend/dist).
  frontend:dist:
    internal: true
    cmds:
      - task: common:build:frontend
        vars:
          DEV: "true"

  test:go:
    summary: Тесты ядра и MCP-моста на Go (без окна и без собранного фронтенда)
    cmds:
      - go test ./internal/... ./cmd/...

  test:frontend:
    summary: Тесты фронтенда (Vitest)
    dir: frontend
    cmds:
      - yarn test

  test:
    summary: Все тесты
    cmds:
      - task: test:go
      - task: test:frontend

  lint:go:
    summary: gofmt, go vet и staticcheck
    deps: [frontend:dist]
    cmds:
      - cmd: |
          unformatted=$(gofmt -l $(git ls-files --cached --others --exclude-standard '*.go'))
          if [ -n "$unformatted" ]; then echo "Не отформатировано gofmt:"; echo "$unformatted"; exit 1; fi
      - go vet ./...
      - go tool staticcheck ./...

  lint:frontend:
    summary: ESLint и Prettier
    dir: frontend
    cmds:
      - yarn lint
      - yarn format:check

  lint:
    summary: Все линтеры
    cmds:
      - task: lint:go
      - task: lint:frontend

  typecheck:
    summary: Проверка типов фронтенда
    dir: frontend
    cmds:
      - yarn typecheck

  fmt:
    summary: Отформатировать Go и фронтенд
    cmds:
      - gofmt -w $(git ls-files --cached --others --exclude-standard '*.go')
      - cd frontend && yarn format

  check:
    summary: Все проверки перед коммитом — тесты, линтеры, типы
    cmds:
      - task: deps
      - task: test
      - task: typecheck
      - task: lint
